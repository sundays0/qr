<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR文件传输 - 发送端</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.0/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            color: #00d4aa;
        }
        .section {
            margin-bottom: 20px;
        }
        .file-upload {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #222;
        }
        .file-upload:hover {
            border-color: #00d4aa;
            background: #252525;
        }
        .file-upload input { display: none; }
        .btn {
            background: #00d4aa;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn:hover { background: #00b894; }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #qr-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .qr-frame {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .qr-frame canvas {
            display: block;
            margin: 0 auto;
        }
        .qr-label {
            margin-top: 8px;
            font-size: 12px;
            color: #333;
        }
        .progress {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: #00d4aa;
            transition: width 0.3s;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .controls input[type="number"] {
            width: 60px;
            padding: 5px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        .info {
            background: #222;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 QR文件传输系统 - 发送端</h1>
        
        <div class="section">
            <div class="file-upload" id="fileDropZone">
                <p>📁 点击选择文件或拖拽文件到此处</p>
                <p style="font-size:12px; color:#888; margin-top:8px;">最大建议文件大小: 10MB</p>
                <input type="file" id="fileInput">
            </div>
        </div>

        <div class="info" id="fileInfo" style="display:none;">
            <strong>已选择:</strong> <span id="fileName"></span> 
            (<span id="fileSize"></span>)
        </div>

        <div class="controls">
            <label>
                帧延迟(ms):
                <input type="number" id="frameDelay" value="200" min="50" max="2000">
            </label>
            <label>
                冗余率(%):
                <input type="number" id="redundancy" value="30" min="0" max="100">
            </label>
            <button class="btn" id="generateBtn" disabled>🔄 生成QR序列</button>
            <button class="btn" id="playBtn" disabled>▶️ 开始播放</button>
            <button class="btn" id="stopBtn" disabled>⏸️ 停止</button>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>
        <div style="text-align:center; font-size:13px;" id="progressText">就绪</div>

        <div id="qr-container"></div>
    </div>

    <script>
        class ReedSolomonEncoder {
            // GF(256) 下的RS编码器简化实现
            constructor(nsym) {
                this.nsym = nsym; // 纠错符号数
                this.initGaloisField();
            }

            initGaloisField() {
                // 初始化GF(256)对数表和指数表
                this.exp = new Array(512).fill(0);
                this.log = new Array(256).fill(0);
                let x = 1;
                for (let i = 0; i < 255; i++) {
                    this.exp[i] = x;
                    this.log[x] = i;
                    x <<= 1;
                    if (x & 0x100) x ^= 0x11d; // 本原多项式
                }
                for (let i = 255; i < 512; i++) {
                    this.exp[i] = this.exp[i - 255];
                }
            }

            gfMul(a, b) {
                if (a === 0 || b === 0) return 0;
                return this.exp[this.log[a] + this.log[b]];
            }

            gfDiv(a, b) {
                if (a === 0) return 0;
                if (b === 0) throw new Error("Division by zero");
                return this.exp[(this.log[a] - this.log[b] + 255) % 255];
            }

            gfPolyMul(p, q) {
                const r = new Array(p.length + q.length - 1).fill(0);
                for (let j = 0; j < q.length; j++) {
                    for (let i = 0; i < p.length; i++) {
                        r[i + j] ^= this.gfMul(p[i], q[j]);
                    }
                }
                return r;
            }

            generatorPoly() {
                let g = [1];
                for (let i = 0; i < this.nsym; i++) {
                    g = this.gfPolyMul(g, [1, this.exp[i]]);
                }
                return g;
            }

            encode(data) {
                const gen = this.generatorPoly();
                const residue = new Array(gen.length - 1).fill(0);
                const msgOut = [...data, ...residue];
                
                for (let i = 0; i < data.length; i++) {
                    const coef = msgOut[i];
                    if (coef !== 0) {
                        for (let j = 1; j < gen.length; j++) {
                            msgOut[i + j] ^= this.gfMul(gen[j], coef);
                        }
                    }
                }
                
                // 返回原始数据 + 纠错码
                return [...data, ...msgOut.slice(data.length)];
            }
        }

        class FileQRTransmitter {
            constructor() {
                this.fileData = null;
                this.frames = [];
                this.currentFrame = 0;
                this.isPlaying = false;
                this.playInterval = null;
                this.frameDelay = 200;
                this.redundancyRate = 0.3; // 30% 冗余
            }

            // 使用简单哈希链而非完整默克尔树，适合此场景
            computeFrameHash(data) {
                let hash = 0;
                for (let i = 0; i < data.length; i++) {
                    hash = ((hash << 5) - hash + data[i]) | 0;
                }
                return hash >>> 0;
            }

            async prepareFile(file) {
                // 读取文件
                const arrayBuffer = await file.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                
                // 压缩数据以提高效率
                const compressed = fflate.deflateSync(uint8Array, { level: 9 });
                this.fileData = compressed;
                
                // 计算分片
                const chunkSize = 1200; // 每个QR码的数据容量（考虑到开销）
                const totalChunks = Math.ceil(this.fileData.length / chunkSize);
                const redundancyChunks = Math.floor(totalChunks * this.redundancyRate);
                
                // 初始化RS编码器
                const rsEncoder = new ReedSolomonEncoder(redundancyChunks);
                
                // 生成原始分片
                const originalChunks = [];
                for (let i = 0; i < totalChunks; i++) {
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, this.fileData.length);
                    originalChunks.push(Array.from(this.fileData.slice(start, end)));
                }
                
                // 构建数据矩阵用于RS编码（按列编码）
                const maxLen = Math.max(...originalChunks.map(c => c.length));
                const paddedChunks = originalChunks.map(c => [...c, ...new Array(maxLen - c.length).fill(0)]);
                
                // 转置以便按列编码
                const transposed = [];
                for (let j = 0; j < maxLen; j++) {
                    transposed.push(paddedChunks.map(c => c[j]));
                }
                
                // 对每列进行RS编码
                const encodedColumns = transposed.map(col => {
                    const paddingNeeded = Math.max(0, (255 - redundancyChunks) - totalChunks);
                    const padded = [...col, ...new Array(Math.max(0, 255 - redundancyChunks - col.length)).fill(0)];
                    return rsEncoder.encode(padded);
                });
                
                // 构建最终帧
                this.frames = [];
                const totalFrames = totalChunks + redundancyChunks;
                
                // 文件元数据
                const metadata = {
                    name: file.name,
                    size: file.size,
                    totalFrames: totalFrames,
                    originalChunks: totalChunks,
                    redundancyChunks: redundancyChunks,
                    chunkSize: maxLen,
                    compressedSize: this.fileData.length
                };
                
                // 元数据帧（首帧）
                const metadataJson = JSON.stringify(metadata);
                const metadataBytes = new TextEncoder().encode(metadataJson);
                this.frames.push({
                    type: 'metadata',
                    index: 0,
                    total: totalFrames + 1,
                    data: Array.from(metadataBytes),
                    prevHash: 0,
                    nextHash: 0
                });
                
                // 数据帧
                for (let i = 0; i < totalFrames; i++) {
                    const frameData = encodedColumns.map(col => col[i] || 0);
                    
                    // 计算前后帧哈希
                    const prevHash = i > 0 ? this.computeFrameHash(this.frames[this.frames.length - 1].data) : 0;
                    
                    this.frames.push({
                        type: 'data',
                        index: i + 1,
                        total: totalFrames + 1,
                        data: frameData,
                        prevHash: prevHash,
                        nextHash: 0 // 将在后续帧生成时更新
                    });
                    
                    // 更新前一帧的nextHash
                    if (this.frames.length > 2) {
                        const currentHash = this.computeFrameHash(frameData);
                        this.frames[this.frames.length - 2].nextHash = currentHash;
                    }
                }
                
                // 设置最后一帧的nextHash
                const lastDataHash = this.computeFrameHash(this.frames[this.frames.length - 1].data);
                this.frames[this.frames.length - 2].nextHash = lastDataHash;
                
                return this.frames.length;
            }

            async generateQRCode(frameData) {
                const jsonStr = JSON.stringify(frameData);
                // 使用Base64减少JSON大小
                const base64 = btoa(jsonStr);
                const canvas = document.createElement('canvas');
                await QRCode.toCanvas(canvas, base64, {
                    width: 300,
                    margin: 2,
                    errorCorrectionLevel: 'H', // 高纠错级别
                    color: {
                        dark: '#000000',
                        light: '#ffffff'
                    }
                });
                return canvas;
            }

            async displayFrame(frameIndex) {
                const container = document.getElementById('qr-container');
                container.innerHTML = '';
                
                if (frameIndex >= 0 && frameIndex < this.frames.length) {
                    const frame = this.frames[frameIndex];
                    const canvas = await this.generateQRCode(frame);
                    const wrapper = document.createElement('div');
                    wrapper.className = 'qr-frame';
                    wrapper.appendChild(canvas);
                    
                    const label = document.createElement('div');
                    label.className = 'qr-label';
                    label.textContent = `帧 ${frame.type === 'metadata' ? '元数据' : frame.index}/${frame.total}`;
                    wrapper.appendChild(label);
                    
                    container.appendChild(wrapper);
                    
                    const progress = ((frameIndex + 1) / this.frames.length) * 100;
                    document.getElementById('progressBar').style.width = progress + '%';
                    document.getElementById('progressText').textContent = 
                        `帧 ${frameIndex + 1}/${this.frames.length} (${progress.toFixed(1)}%)`;
                }
            }

            async startPlayback() {
                if (this.isPlaying) return;
                this.isPlaying = true;
                this.currentFrame = 0;
                
                const playNext = async () => {
                    if (!this.isPlaying || this.currentFrame >= this.frames.length) {
                        if (this.currentFrame >= this.frames.length) {
                            // 循环播放以支持接收端重新捕获
                            this.currentFrame = 0;
                            setTimeout(playNext, 1000); // 循环间隔
                            return;
                        }
                        return;
                    }
                    
                    await this.displayFrame(this.currentFrame);
                    this.currentFrame++;
                    
                    setTimeout(playNext, this.frameDelay);
                };
                
                await playNext();
            }

            stopPlayback() {
                this.isPlaying = false;
                this.currentFrame = 0;
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').textContent = '已停止';
            }
        }

        // UI逻辑
        const transmitter = new FileQRTransmitter();
        
        document.getElementById('fileDropZone').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        
        document.getElementById('fileDropZone').addEventListener('dragover', (e) => {
            e.preventDefault();
            e.target.style.borderColor = '#00d4aa';
        });
        
        document.getElementById('fileDropZone').addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.target.style.borderColor = '#333';
        });
        
        document.getElementById('fileDropZone').addEventListener('drop', async (e) => {
            e.preventDefault();
            e.target.style.borderColor = '#333';
            const file = e.dataTransfer.files[0];
            if (file) await handleFileSelect(file);
        });
        
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) await handleFileSelect(file);
        });
        
        async function handleFileSelect(file) {
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileInfo').style.display = 'block';
            
            const totalFrames = await transmitter.prepareFile(file);
            document.getElementById('progressText').textContent = 
                `已准备 ${totalFrames} 个QR帧`;
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('playBtn').disabled = false;
        }
        
        document.getElementById('frameDelay').addEventListener('change', (e) => {
            transmitter.frameDelay = parseInt(e.target.value);
        });
        
        document.getElementById('redundancy').addEventListener('change', (e) => {
            transmitter.redundancyRate = parseInt(e.target.value) / 100;
        });
        
        document.getElementById('generateBtn').addEventListener('click', async () => {
            if (transmitter.frames.length > 0) {
                await transmitter.displayFrame(0);
                document.getElementById('progressText').textContent = 'QR序列已生成';
            }
        });
        
        document.getElementById('playBtn').addEventListener('click', async () => {
            document.getElementById('playBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            await transmitter.startPlayback();
        });
        
        document.getElementById('stopBtn').addEventListener('click', () => {
            transmitter.stopPlayback();
            document.getElementById('playBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        });
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
