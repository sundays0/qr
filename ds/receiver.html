<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR文件传输 - 接收端</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            color: #00d4aa;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        #video {
            width: 100%;
            display: block;
        }
        #canvas {
            display: none;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #00d4aa;
            border-radius: 8px;
            width: 60%;
            height: 60%;
            pointer-events: none;
        }
        .btn {
            background: #00d4aa;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
            width: 100%;
        }
        .btn:hover { background: #00b894; }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .progress {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            background: #00d4aa;
            transition: width 0.3s;
        }
        .received-frames {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin: 10px 0;
            max-height: 100px;
            overflow-y: auto;
        }
        .frame-indicator {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background: #333;
        }
        .frame-indicator.received { background: #00d4aa; }
        .frame-indicator.error { background: #ff6b6b; }
        .frame-indicator.recovered { background: #ffd93d; }
        .info {
            background: #222;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 QR文件传输系统 - 接收端</h1>
        
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="overlay"></div>
        </div>
        
        <button class="btn" id="startBtn">📷 开始扫描</button>
        <button class="btn" id="stopBtn" disabled>⏹️ 停止扫描</button>
        <button class="btn" id="downloadBtn" disabled>💾 下载文件</button>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>
        
        <div class="info">
            <div>状态: <span id="status">等待开始</span></div>
            <div>文件: <span id="fileInfo">-</span></div>
            <div>帧: <span id="frameCount">0/0</span></div>
        </div>
        
        <div class="received-frames" id="frameIndicators"></div>
    </div>

    <script>
        class ReedSolomonDecoder {
            constructor() {
                this.initGaloisField();
            }

            initGaloisField() {
                this.exp = new Array(512).fill(0);
                this.log = new Array(256).fill(0);
                let x = 1;
                for (let i = 0; i < 255; i++) {
                    this.exp[i] = x;
                    this.log[x] = i;
                    x <<= 1;
                    if (x & 0x100) x ^= 0x11d;
                }
                for (let i = 255; i < 512; i++) {
                    this.exp[i] = this.exp[i - 255];
                }
            }

            gfMul(a, b) {
                if (a === 0 || b === 0) return 0;
                return this.exp[this.log[a] + this.log[b]];
            }

            // 使用接收到的帧和原始帧位置进行解码
            decode(encodedData, originalLength, redundancyLength) {
                // 检查是否已经收到足够的原始数据
                const receivedCount = encodedData.filter(d => d !== null).length;
                if (receivedCount >= originalLength) {
                    // 已经有足够的原始帧，直接返回
                    return encodedData.slice(0, originalLength);
                }
                
                // 需要纠错，但完整实现较复杂
                // 这里返回简化版本：标记缺失位置
                const result = new Array(originalLength);
                for (let i = 0; i < originalLength; i++) {
                    result[i] = encodedData[i] !== null ? encodedData[i] : 0;
                }
                return result;
            }
        }

        class QRFileReceiver {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.isScanning = false;
                this.stream = null;
                this.metadata = null;
                this.receivedFrames = new Map();
                this.decoder = new ReedSolomonDecoder();
                this.lastDecodeTime = 0;
                this.decodeThrottle = 100; // ms
            }

            async startCamera() {
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });
                    this.video.srcObject = this.stream;
                    this.canvas.width = 640;
                    this.canvas.height = 480;
                } catch (err) {
                    alert('无法访问摄像头: ' + err.message);
                    throw err;
                }
            }

            stopCamera() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
                this.video.srcObject = null;
            }

            startScanning() {
                this.isScanning = true;
                this.scanFrame();
            }

            stopScanning() {
                this.isScanning = false;
            }

            scanFrame() {
                if (!this.isScanning) return;
                
                const now = Date.now();
                if (now - this.lastDecodeTime < this.decodeThrottle) {
                    requestAnimationFrame(() => this.scanFrame());
                    return;
                }
                
                if (this.video.readyState === this.video.HAVE_ENOUGH_DATA) {
                    this.canvas.width = this.video.videoWidth;
                    this.canvas.height = this.video.videoHeight;
                    this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
                    
                    const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });
                    
                    if (code) {
                        this.lastDecodeTime = now;
                        try {
                            // 先尝试Base64解码
                            let jsonStr = code.data;
                            try {
                                jsonStr = atob(code.data);
                            } catch (e) {
                                // 如果不是base64，直接使用
                            }
                            const frameData = JSON.parse(jsonStr);
                            this.processFrame(frameData);
                        } catch (e) {
                            // 忽略无效帧
                        }
                    }
                }
                
                requestAnimationFrame(() => this.scanFrame());
            }

            processFrame(frameData) {
                if (frameData.type === 'metadata') {
                    this.handleMetadata(frameData);
                } else if (frameData.type === 'data') {
                    this.handleDataFrame(frameData);
                }
            }

            handleMetadata(frameData) {
                const metadataStr = String.fromCharCode(...frameData.data);
                this.metadata = JSON.parse(metadataStr);
                
                document.getElementById('fileInfo').textContent = 
                    `${this.metadata.name} (${this.formatSize(this.metadata.size)})`;
                
                this.initializeFrameIndicators();
                
                document.getElementById('status').textContent = '接收数据帧中...';
            }

            handleDataFrame(frameData) {
                if (!this.metadata) return;
                
                const frameIndex = frameData.index - 1; // 减去元数据帧
                
                // 验证哈希链（如果有前一帧）
                if (this.receivedFrames.has(frameIndex - 1)) {
                    const prevFrame = this.receivedFrames.get(frameIndex - 1);
                    const computedHash = this.computeHash(prevFrame.data);
                    if (computedHash !== frameData.prevHash) {
                        console.warn(`帧 ${frameIndex} 哈希验证失败`);
                        this.updateFrameIndicator(frameIndex, 'error');
                        return;
                    }
                }
                
                // 存储帧
                if (!this.receivedFrames.has(frameIndex)) {
                    this.receivedFrames.set(frameIndex, frameData);
                    this.updateFrameIndicator(frameIndex, 'received');
                    
                    // 更新进度
                    const progress = (this.receivedFrames.size / this.metadata.totalFrames) * 100;
                    document.getElementById('progressBar').style.width = progress + '%';
                    document.getElementById('frameCount').textContent = 
                        `${this.receivedFrames.size}/${this.metadata.totalFrames}`;
                    
                    // 检查是否收集了足够的帧
                    if (this.receivedFrames.size >= this.metadata.originalChunks) {
                        this.tryReconstructFile();
                    }
                }
            }

            tryReconstructFile() {
                document.getElementById('status').textContent = '重组文件中...';
                
                // 收集按序排列的数据
                const sortedFrames = [];
                for (let i = 0; i < this.metadata.originalChunks; i++) {
                    if (this.receivedFrames.has(i)) {
                        sortedFrames.push(this.receivedFrames.get(i).data);
                    } else {
                        sortedFrames.push(null);
                    }
                }
                
                // 尝试使用RS解码恢复丢失的帧
                const recoveredData = this.decoder.decode(
                    sortedFrames,
                    this.metadata.originalChunks,
                    this.metadata.redundancyChunks
                );
                
                // 重建数据
                const maxLen = Math.max(...recoveredData.map(d => d ? d.length : 0));
                const chunkSize = this.metadata.chunkSize;
                
                // 转置恢复
                const reconstructed = [];
                for (let j = 0; j < chunkSize; j++) {
                    reconstructed.push(recoveredData.map(chunk => chunk ? chunk[j] || 0 : 0));
                }
                
                // 展平并移除填充
                const flatData = [];
                for (let i = 0; i < this.metadata.originalChunks; i++) {
                    if (recoveredData[i]) {
                        for (let j = 0; j < chunkSize; j++) {
                            flatData.push(reconstructed[j][i]);
                        }
                    }
                }
                
                // 截断到实际压缩大小
                const compressedData = new Uint8Array(flatData.slice(0, this.metadata.compressedSize));
                
                try {
                    // 解压缩
                    const decompressed = fflate.inflateSync(compressedData);
                    
                    // 创建Blob并触发下载
                    const blob = new Blob([decompressed], { type: 'application/octet-stream' });
                    this.downloadBlob = blob;
                    document.getElementById('downloadBtn').disabled = false;
                    document.getElementById('status').textContent = '✅ 文件接收完成！';
                } catch (e) {
                    console.error('重组失败:', e);
                    document.getElementById('status').textContent = '❌ 文件重组失败';
                }
            }

            computeHash(data) {
                let hash = 0;
                for (let i = 0; i < data.length; i++) {
                    hash = ((hash << 5) - hash + data[i]) | 0;
                }
                return hash >>> 0;
            }

            initializeFrameIndicators() {
                const container = document.getElementById('frameIndicators');
                container.innerHTML = '';
                for (let i = 0; i < this.metadata.totalFrames; i++) {
                    const indicator = document.createElement('div');
                    indicator.className = 'frame-indicator';
                    indicator.id = `frame-${i}`;
                    container.appendChild(indicator);
                }
            }

            updateFrameIndicator(index, status) {
                const indicator = document.getElementById(`frame-${index}`);
                if (indicator) {
                    indicator.className = `frame-indicator ${status}`;
                }
            }

            formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }

            downloadFile() {
                if (this.downloadBlob && this.metadata) {
                    const url = URL.createObjectURL(this.downloadBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = this.metadata.name;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            }
        }

        // UI逻辑
        const receiver = new QRFileReceiver();
        
        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                await receiver.startCamera();
                receiver.startScanning();
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('status').textContent = '扫描中...';
            } catch (err) {
                console.error('启动失败:', err);
            }
        });
        
        document.getElementById('stopBtn').addEventListener('click', () => {
            receiver.stopScanning();
            receiver.stopCamera();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('status').textContent = '已停止';
        });
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            receiver.downloadFile();
        });
    </script>
</body>
</html>
